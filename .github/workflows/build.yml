name: Build Windows executable

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate icon
        run: |
          python tools/make_icon.py

      - name: Build executable
        run: |
          pyinstaller --onefile --name android-ip-rotator --icon icon.ico menu.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-ip-rotator-exe
          path: dist/android-ip-rotator.exe

      - name: Attach executable to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item dist/android-ip-rotator.exe "dist/AIT_ADB-${{ github.event.release.tag_name }}.exe"
          gh release upload "${{ github.event.release.tag_name }}" "dist/AIT_ADB-${{ github.event.release.tag_name }}.exe" --clobber
